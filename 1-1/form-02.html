<title>형성평가 · 산소의 순환과 대산소화 사건 (지구시스템과학1 Ⅰ-1 02)</title>

<script>
/* 형성평가 — 지구시스템과학1 Ⅰ-1 02 산소의 순환과 대산소화 사건(남세균 · 호상철광층 · 대산소화 사건 · 오존층과 육상 진출). 값은 단원 화면과 칠판 강의 화면(board-02.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "지구시스템과학1", unit: "Ⅰ-1 지구의 탄생과 물질의 순환", part: "02 산소의 순환과 대산소화 사건",
  std: ["12지시01-01", "12지시01-02"], board: "board-02.html", sheet: "sheet-02.html", time: "10분",
  items: [
    { lv: "기본", type: "short", ref: 4,
      q: "약 27억 년 전 바다에서 광합성으로 산소를 내놓기 시작해, 스트로마톨라이트를 쌓은 생물은 무엇일까요?",
      a: ["남세균", "시아노박테리아", "남조류"], why: "남세균이 광합성(이산화 탄소 + 물 → 유기물 + 산소)으로 지구에 산소를 본격적으로 내놓기 시작했습니다." },
    { lv: "기본", type: "mc", ref: 5,
      q: "호상철광층이 만들어진 과정으로 옳은 것은?",
      opts: ["대기의 산소가 육지 암석의 철을 녹여 바다로 보냈다",
             "바닷물에 녹아 있던 철 이온이 산소와 만나 산화철이 되어 가라앉아 쌓였다",
             "철을 실은 운석이 바다에 떨어져 쌓였다",
             "화산이 뿜은 용암이 바닷속에서 줄무늬로 굳었다"],
      a: 1, why: "산소가 없던 바다에는 철 이온(Fe²⁺)이 녹아 있었습니다. 남세균의 산소가 이를 산화시키자 물에 녹지 않는 산화철이 해저에 줄무늬로 쌓였습니다." },
    { lv: "기본", type: "mc", ref: 9,
      q: "성층권의 오존층에 대한 설명으로 옳은 것은?",
      opts: ["대기에 산소가 쌓이기 전부터 있었다",
             "산소 분자가 자외선에 쪼개진 뒤 다른 산소 분자와 붙어 생긴 오존이 모여 있다",
             "지표에 닿는 자외선의 양을 늘린다",
             "바닷속 철 이온이 산화되어 만들어진다"],
      a: 1, why: "O₂가 자외선을 받아 O로 쪼개지고, O가 다른 O₂와 붙어 O₃(오존)가 됩니다. 그러니 오존층은 대기에 산소가 쌓인 뒤에야 생겼고, 자외선을 흡수해 지표에 닿는 양을 줄입니다." },
    { lv: "발전", type: "short", ref: 6, unit: "칸",
      q: "단원 화면의 산소 수지 모형에서 처음 바닷속 철 이온은 100이고, ‘철이 바닥나는 때 = 100 ÷ 남는 산소’(1칸 = 1천만 년)입니다. 남세균의 산소 생산이 9, 화산 기체가 먹는 양이 5라면, 대기에 산소가 쌓이기 시작하는 것은 몇 칸 뒤일까요?",
      a: ["25", "25칸"], why: "남는 산소는 9 − 5 = 4입니다. 100 ÷ 4 = 25칸, 곧 약 2억 5천만 년 동안은 산소가 철을 산화시키는 데 모두 쓰이고, 그 뒤에야 대기에 쌓입니다." },
    { lv: "발전", type: "mc", ref: 7,
      q: "그림은 지질 기록으로 복원한 대기 산소 농도(단원 화면 값, 세로축은 10배씩 커지는 눈금)입니다. 옳은 해석만을 〈보기〉에서 있는 대로 고른 것은?",
      fig: (function () {
        var C = [[46, 0.0001], [24, 0.0001], [20, 2], [8, 2], [5.4, 15], [3, 30], [2, 15], [0, 21]];
        function o2(a) { for (var i = 0; i < C.length - 1; i++) { var p = C[i], q = C[i + 1]; if (a <= p[0] && a >= q[0]) return p[1] + (q[1] - p[1]) * ((p[0] - a) / (p[0] - q[0])); } return 21; }
        var X0 = 60, X1 = 540, Y0 = 170, Y1 = 20, s = "";
        function X(a) { return X0 + (46 - a) / 46 * (X1 - X0); }
        function Y(v) { return Y0 - (Math.log(Math.max(v, 0.0001)) / Math.LN10 + 4) / 6 * (Y0 - Y1); }
        s += "<svg viewBox='0 0 560 210' width='560' height='210' aria-label='대기 산소 농도 곡선: 약 24억 년 전까지 거의 0, 약 20억 년 전 약 2%, 약 3억 년 전 약 30%, 지금 21%'>";
        [[0.0001, "0.0001"], [0.01, "0.01"], [1, "1"], [100, "100"]].forEach(function (g) { s += "<line x1='" + X0 + "' y1='" + Y(g[0]) + "' x2='" + X1 + "' y2='" + Y(g[0]) + "' stroke='#dfe4ec'/><text x='" + (X0 - 6) + "' y='" + (Y(g[0]) + 4) + "' font-size='12' text-anchor='end'>" + g[1] + "</text>"; });
        var p = []; for (var a = 46; a >= 0; a -= 0.2) p.push(X(a).toFixed(1) + " " + Y(o2(a)).toFixed(1));
        s += "<polyline points='" + p.join(" ") + "' fill='none' stroke='#1462d8' stroke-width='2.5'/>";
        s += "<line x1='" + X0 + "' y1='" + Y0 + "' x2='" + X1 + "' y2='" + Y0 + "' stroke='#161b28' stroke-width='2'/>";
        [46, 40, 30, 24, 20, 10, 3, 0].forEach(function (a) { s += "<text x='" + X(a) + "' y='" + (Y0 + 16) + "' font-size='12' text-anchor='middle'>" + a + "</text>"; });
        s += "<text x='" + X1 + "' y='" + (Y0 + 34) + "' font-size='12' text-anchor='end'>억 년 전</text><text x='4' y='12' font-size='12'>산소 (%)</text></svg>";
        return s;
      })(),
      box: "ㄱ. 호상철광층이 쌓이던 약 27억~24억 년 전에는 대기에 산소가 거의 없었다.<br>ㄴ. 대기 산소는 대산소화 사건 때 한 번에 지금 수준(21%)에 이르렀다.<br>ㄷ. 대기 산소 농도가 가장 높았던 때는 지금이다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 0, why: "산소는 약 24억 년 전까지 사실상 0이었습니다(ㄱ). 대산소화 사건 뒤에는 약 2%에서 오래 머물다 약 8억 년 전부터 두 번째로 크게 늘었으므로 ㄴ은 틀립니다. 가장 높았던 때는 약 3억 년 전(약 30%)이므로 ㄷ도 틀립니다." },
    { lv: "발전", type: "mc", ref: 6,
      q: "단원 화면의 산소 수지 모형에서 남세균의 산소 생산을 5, 화산 기체가 산소를 먹는 속도를 6으로 두고 200칸을 흘려보냈습니다. 일어나는 일로 옳은 것은?",
      opts: ["바닷속 철이 줄어들고 대기에도 산소가 쌓인다",
             "바닷속 철은 줄지 않고, 대기에도 산소가 쌓이지 않는다",
             "바닷속 철은 그대로지만 대기에는 산소가 쌓인다",
             "바닷속 철이 50칸 만에 모두 사라진다"],
      a: 1, why: "남는 산소가 5 − 6 = −1로 0 이하입니다. 만든 산소를 화산 기체가 모두 먹어 치우니 철을 산화시킬 산소도, 대기에 쌓일 산소도 없습니다. 산소를 만든다고 곧바로 대기에 쌓이는 것이 아닙니다." },
    { lv: "심화", type: "mc", ref: 10,
      q: "단원 화면의 오존층 모형에서 지표에 닿는 자외선은 산소 약 1% 수준에서 30% 이상, 산소 약 14%에서 1% 아래, 지금(21%)은 약 0.3%입니다. 이에 대한 해석으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 대기 산소가 늘수록 오존층이 두꺼워져 지표에 닿는 자외선이 줄어든다.<br>ㄴ. 이 모형에서 대산소화 사건 직후(산소 약 2%)에는 지표에 닿는 자외선이 이미 1% 아래였다.<br>ㄷ. 1% 문턱(산소 약 14%)은 수업용 값이며, 실제로는 이보다 낮은 산소 농도에서도 오존층이 자외선을 상당히 막았다고 본다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "ㄱ은 모형의 경향 그대로입니다. 모형에서 1% 아래가 되려면 산소가 약 14%는 되어야 하므로, 산소 약 2%일 때는 자외선이 약 20% 지표에 닿습니다(ㄴ 틀림). 단원 화면의 ‘과학자의 눈’처럼 실제로는 산소 약 2%만 되어도 상당히 막았다고 봅니다(ㄷ)." },
    { lv: "심화", type: "essay", ref: 11,
      q: "‘호상철광층은 대기에 산소가 쌓이기 전의 기록이다’라는 말이 옳은 까닭을 산소가 쌓인 순서(바다 → 대기)를 들어 설명하세요. 또 대기에 산소가 쌓인 뒤 생물권에 일어난 변화를 한 가지 쓰세요.",
      model: "남세균이 만든 산소는 먼저 바닷물에 녹아 있던 철 이온을 산화시키는 데 쓰였고, 이때 생긴 산화철이 해저에 쌓여 호상철광층이 되었다. 바닷속 철이 거의 바닥난 약 24억 년 전부터 비로소 대기에 산소가 쌓였으므로(대산소화 사건) 호상철광층은 그 이전의 기록이다. 대기의 산소로 성층권에 오존층이 생겨 자외선을 막자 생물이 육상으로 진출했다.",
      rubric: ["산소가 바닷속 철 이온을 먼저 산화시켜 호상철광층이 쌓였다고 썼다", "철이 바닥난 뒤에야 대기에 산소가 쌓였다(대산소화 사건)고 순서를 설명했다", "오존층 형성과 육상 진출을 생물권의 변화로 연결했다"] }
  ]
};
</script>
