<title>형성평가 · 지구의 탄생 (지구시스템과학1 Ⅰ-1 01)</title>

</head>
<body>
<script>
/* 형성평가 — 지구시스템과학1 Ⅰ-1 01 지구의 탄생(마그마 바다 · 층상 분화 · 원시 대기와 원시 바다 · 행성의 갈림길). 값은 단원 화면과 칠판 강의 화면(board-01.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "지구시스템과학1", unit: "Ⅰ-1 지구의 탄생과 물질의 순환", part: "01 지구의 탄생",
  std: ["12지시01-01"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
  items: [
    { lv: "기본", type: "short", ref: 4,
      q: "갓 태어난 지구는 미행성 충돌 에너지와 방사성 원소의 붕괴열로 지표 전체가 녹아 있었습니다. 지표가 녹은 암석으로 뒤덮여 있던 이 상태를 무엇이라고 할까요?",
      a: ["마그마 바다", "마그마의 바다", "마그마오션"], why: "지표 온도가 1200 ℃를 넘어 규산염 암석이 모두 녹은 상태가 마그마 바다입니다. 충돌이 잦아들어 700 ℃ 아래로 식으면 원시 지각이 굳기 시작합니다." },
    { lv: "기본", type: "mc", ref: 6,
      q: "원시 지구에서 일어난 층상 분화의 결과로 옳은 것은?",
      opts: ["철·니켈이 떠올라 지각이 되었다",
             "규산염 물질이 가라앉아 핵이 되었다",
             "밀도가 큰 철·니켈은 핵이 되고, 밀도가 작은 규산염은 맨틀과 지각이 되었다",
             "모든 물질이 고르게 섞여 층이 생기지 않았다"],
      a: 2, why: "녹아 있는 동안 밀도에 따라 물질이 자리를 바꾸었습니다. 무거운 철·니켈은 가라앉아 핵, 가벼운 규산염은 떠올라 맨틀과 지각이 되었습니다." },
    { lv: "기본", type: "mc", ref: 9,
      q: "원시 대기에 대한 설명으로 옳은 것은?",
      opts: ["지금처럼 질소와 산소가 대부분이었다",
             "화산 활동으로 지구 속에서 빠져나온 수증기와 이산화 탄소가 대부분이었다",
             "바다에서 증발한 산소가 대부분이었다",
             "처음부터 두꺼운 오존층이 있었다"],
      a: 1, why: "원시 대기는 화산 기체(수증기·이산화 탄소)로 이루어졌고 산소는 거의 없었습니다. 산소와 오존층은 훨씬 뒤 생물의 광합성으로 생겼습니다(이야기 ②)." },
    { lv: "발전", type: "mc", ref: 7,
      q: "단원 화면 모형에서 층상 분화 진행률은 지구가 만들어진 뒤 약 1,900만 년에 50%, 약 7,700만 년에 95%였습니다. 이와 관련한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 분화는 처음에 빠르게 진행되고, 끝에 가까울수록 느려졌다.<br>ㄴ. 층상 분화는 지구가 완전히 굳어 단단해진 뒤에 일어났다.<br>ㄷ. 외핵의 대류로 생기는 지구 자기장은 핵이 만들어진 뒤에 생겼다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "0% → 50%에 약 1,900만 년, 50% → 95%에 약 5,800만 년이 더 걸렸으니 갈수록 느려졌습니다(ㄱ). 굳은 암석 속에서는 물질이 밀도에 따라 자리를 바꿀 수 없으므로 ㄴ은 틀립니다. 핵이 먼저 생기고, 액체 외핵의 대류가 자기장을 만들었습니다(ㄷ)." },
    { lv: "발전", type: "mc", ref: 11,
      q: "단원 화면의 행성 모형에서 질량을 지구와 같게(1배) 둔 채, 태양으로부터의 거리만 1 AU에서 금성 자리인 0.72 AU로 옮겼습니다. 어떤 행성이 될까요?",
      opts: ["🌊 바다 행성", "🔥 폭주 온실 행성", "🧊 얼어붙은 행성", "🪨 대기를 잃은 행성"],
      a: 1, why: "질량이 충분해 기체는 붙잡지만, 태양에 가까워 받는 햇빛이 지구의 약 1.9배(1 ÷ 0.72²)가 됩니다. 수증기가 끝내 응결하지 못하고 대기에 남아 온실 효과를 키우는 폭주 온실이 됩니다. 갈림길을 만든 것은 재료가 아니라 자리였습니다." },
    { lv: "발전", type: "short", ref: 11,
      q: "금성(0.72 AU, 질량 0.82배)과 화성(1.52 AU, 질량 0.10배) 가운데, 액체 바다를 잃은 까닭이 ‘질량이 작아 대기를 붙잡기 어렵고 내부가 빨리 식었다’에 더 가까운 행성의 이름을 쓰세요.",
      a: ["화성"], why: "금성은 질량이 지구와 거의 같아 대기를 붙잡았지만 너무 뜨거워 폭주 온실이 되었습니다. 화성은 질량이 지구의 약 1/10이라 대기가 얇아지고 얼어붙었습니다." },
    { lv: "심화", type: "mc", ref: 10,
      q: "원시 지구에 원시 바다가 생기면서 일어난 변화로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 지표가 식어 대기의 수증기가 응결하면서 대기 중 수증기가 줄었다.<br>ㄴ. 대기의 이산화 탄소가 바다에 녹아 대기 중 이산화 탄소가 줄었다.<br>ㄷ. 바다에서 산소가 증발해 대기에 산소가 쌓이기 시작했다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "수증기가 비가 되어 바다를 채웠고(ㄱ), 이산화 탄소가 바다에 녹아 대기에서 줄었습니다(ㄴ). 대기의 산소는 바다에서 증발한 것이 아니라 훨씬 뒤 남세균의 광합성으로 생겼습니다(ㄷ 틀림)." },
    { lv: "심화", type: "essay", ref: 11,
      q: "질량은 지구와 같지만 태양에서 0.5 AU 떨어진 곳에서 태어난 행성이 있다고 합시다. 이 행성에 원시 바다가 생길 수 있을지 예상하고, ‘거리’, ‘질량’, ‘수증기의 응결’이라는 말을 넣어 그 근거를 쓰세요.",
      model: "원시 바다가 생기기 어렵다. 질량이 지구와 같아 화산이 내놓은 기체(원시 대기)는 붙잡을 수 있지만, 태양까지의 거리가 0.5 AU로 가까워 받는 햇빛이 지구의 약 4배이다. 지표가 충분히 식지 못해 수증기가 응결하지 못하고 대기에 남아 온실 효과를 키우므로 금성처럼 폭주 온실 행성이 된다.",
      rubric: ["질량이 커서 대기는 붙잡을 수 있다고 썼다", "거리가 가까워 햇빛을 많이 받아 수증기가 응결하지 못한다고 설명했다", "결론(바다가 생기기 어렵다, 폭주 온실)을 근거와 연결했다"] }
  ]
};
</script>
