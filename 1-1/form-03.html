<script>
/* 형성평가 — 지구시스템과학1 Ⅰ-1 03 물과 탄소의 순환(물의 순환 · 탄소 순환 · 규산염 풍화 · 음의 되먹임 · 눈덩이 지구). 값은 단원 화면과 칠판 강의 화면(board-03.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "지구시스템과학1", unit: "Ⅰ-1 지구의 탄생과 물질의 순환", part: "03 물과 탄소의 순환",
  std: ["12지시01-02"], board: "board-03.html", sheet: "sheet-03.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "바닷물을 증발시켜 물의 순환을 일으키는 주된 에너지원은?",
      opts: ["태양 에너지", "지구 내부 에너지", "조력 에너지", "화석 연료의 화학 에너지"],
      a: 0, why: "태양 에너지를 받아 바닷물이 증발하고, 수증기가 비와 눈으로 내린 뒤 하천과 지하수로 바다에 돌아옵니다." },
    { lv: "기본", type: "short", ref: 6,
      q: "빗물에 녹은 이산화 탄소가 규산염 암석을 녹이면서, 대기의 탄소를 탄산 이온으로 바꾸어 바다로 실어 나르는 과정을 무엇이라고 할까요?",
      a: ["규산염 풍화", "풍화", "화학적 풍화"], why: "규산염 풍화로 바다에 간 탄소는 석회암(탄산염 암석)이 되어 해저에 묻힙니다. 화산이 내보내는 탄소와 이 과정이 균형을 이루는 곳에서 대기 CO₂가 정해집니다." },
    { lv: "기본", type: "mc", ref: 12,
      q: "빠른 탄소 순환(수년 ~ 수백 년)에 해당하는 것은?",
      opts: ["바다에서 석회암이 되어 해저에 묻힌다", "묻힌 생물의 유해가 화석 연료가 된다", "생물의 호흡과 분해로 탄소가 대기로 돌아온다", "화산이 지구 속 탄소를 이산화 탄소로 내보낸다"],
      a: 2, why: "호흡과 분해는 며칠에서 몇 해 만에 오가는 빠른 순환입니다. 나머지는 수만 ~ 수억 년이 걸리는 느린 순환입니다." },
    { lv: "발전", type: "short", ref: 4, unit: "km³",
      q: "단원 화면 값으로 바다에서는 해마다 413,000 km³가 증발하고 373,000 km³가 바다에 다시 내리며, 육지에는 113,000 km³가 내립니다. 물의 양이 해마다 균형을 이룬다면, 육지에서 증발(증발산)해 대기로 돌아가는 물은 해마다 몇 km³일까요?",
      a: ["73000", "73,000", "7만3000", "7만 3000"], why: "바다에서 육지로 넘어간 수증기는 413,000 − 373,000 = 40,000 km³이고, 이만큼이 하천·지하수로 바다에 돌아옵니다. 육지에 내린 113,000 가운데 40,000이 흘러 나가므로 113,000 − 40,000 = 73,000 km³가 육지에서 다시 증발합니다." },
    { lv: "발전", type: "mc", ref: 7,
      q: "규산염 풍화와 지구의 기온에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 기온이 오르면 비가 많아져 규산염 풍화가 빨라지고 대기 CO₂가 줄어든다.<br>ㄴ. 규산염 풍화는 처음 변화를 키우는 양의 되먹임으로 작용한다.<br>ㄷ. 단원 화면 모형에서 화산 활동이 2배가 되어도 대기 CO₂는 끝없이 늘지 않고 새 균형점(약 732 ppm)에 머문다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "더워지면 풍화가 빨라져 CO₂를 더 치우고, 추워지면 느려져 CO₂가 쌓입니다. 처음 변화를 줄이는 쪽이므로 음의 되먹임입니다(ㄴ 틀림). 그래서 화산이 늘어도 기온은 새 균형점(모형에서 약 20.5 ℃)에서 멈춥니다." },
    { lv: "발전", type: "mc", ref: 9,
      q: "얼음이 넓어질수록 지구가 더 추워지는 까닭으로 옳은 것은?",
      opts: ["얼음이 햇빛을 잘 되쏘아 지구가 흡수하는 에너지가 줄기 때문이며, 변화를 키우는 양의 되먹임이다",
             "얼음이 대기의 이산화 탄소를 모두 흡수하기 때문이며, 변화를 줄이는 음의 되먹임이다",
             "얼음이 지구 내부에서 올라오는 열을 모두 막기 때문이다",
             "얼음이 햇빛을 더 많이 흡수해 차가워지기 때문이다"],
      a: 0, why: "얼음은 햇빛을 잘 되쏩니다. 얼음 ↑ → 반사 ↑ → 기온 ↓ → 얼음 ↑처럼 처음 변화를 키우므로 양의 되먹임입니다. 그래서 한번 언 지구는 스스로 녹기 어려웠습니다." },
    { lv: "심화", type: "short", ref: 10, unit: "백만 년",
      q: "단원 화면의 탈출 모형에서 눈덩이 지구의 대기 CO₂는 화산 활동 1배마다 백만 년에 3,500 ppm씩 쌓이고, 약 12만 ppm에 이르면 얼음에서 빠져나옵니다. 화산 활동이 지금의 2배라면 탈출까지 약 몇 백만 년이 걸릴까요? (처음 CO₂는 무시하고 정수로 어림하세요.)",
      a: ["17", "약17", "17.5", "약17.5", "18", "약18"], why: "2배이면 백만 년에 7,000 ppm씩 쌓이므로 120,000 ÷ 7,000 ≈ 17백만 년(약 1,700만 년)입니다. 단원 화면은 0.5백만 년 간격으로 계산해 17.5로 보여 줍니다. 화산이 약할수록 오래 걸리고, 0.5배면 6천만 년이 지나도 빠져나오지 못합니다." },
    { lv: "심화", type: "essay", ref: 11,
      q: "나미비아의 약 7억 년 전 지층에서는 빙하 퇴적층 바로 위를 두꺼운 탄산염 암석이 덮고 있습니다. 이것이 ‘눈덩이 지구는 탄소 순환으로 녹았다’는 증거가 되는 까닭을 ‘풍화’, ‘화산’, ‘초온실’이라는 말을 넣어 설명하세요.",
      model: "지구가 얼어 있는 동안 비가 거의 내리지 않아 풍화가 멎었지만, 얼음을 뚫은 화산은 이산화 탄소를 계속 내보내 대기에 쌓였다. 마침내 얼음이 녹자 남아 있던 많은 이산화 탄소 때문에 초온실이 되었고, 뜨겁고 비가 많아 풍화가 폭주하면서 대기의 탄소가 바다로 대량으로 실려 가 탄산염 암석으로 빠르게 쌓였다. 그래서 빙하 퇴적층 바로 위에 두꺼운 탄산염 암석이 놓이게 되었다.",
      rubric: ["얼음 때문에 풍화가 멎은 사이 화산의 CO₂가 쌓였다고 썼다", "녹은 직후 초온실에서 풍화가 폭주했다고 설명했다", "풍화로 바다에 간 탄소가 탄산염 암석으로 쌓여 빙하 퇴적층 바로 위를 덮었다고 연결했다"] }
  ]
};
