window.FORMATIVE = {
  subject: "지구시스템과학1", unit: "Ⅰ-2 판 구조 운동과 지구 내부 구조", part: "04 지진파와 지구 내부 구조",
  std: ["12지시01-05"], board: "board-04.html", sheet: "sheet-04.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "고체·액체·기체를 모두 지나고, 관측소에 가장 먼저 도착하는 지진파는?",
      opts: ["P파", "S파", "표면파", "지진 해일"],
      a: 0, why: "P파는 매질을 앞뒤로 밀고 당기는 종파로 가장 빠르고 고체·액체·기체를 모두 지납니다. S파는 고체만 지나고, 표면파는 가장 느립니다." },
    { lv: "기본", type: "short", ref: 5,
      q: "지진 기록지에서 P파가 도착한 시각과 S파가 도착한 시각의 차이를 무엇이라고 할까요?",
      a: ["PS시", "피에스시"], why: "두 파는 같은 순간에 출발하지만 P파가 더 빨라 먼저 도착합니다. 그 시간 차이가 PS시이고, 진앙에서 멀수록 길어집니다." },
    { lv: "기본", type: "mc", ref: 10,
      q: "지진파의 속도가 갑자기 빨라지는 가장 얕은 경계로, 지각과 맨틀을 나누는 면은?",
      opts: ["모호면", "구텐베르크면", "레만면", "변환 단층"],
      a: 0, why: "모호면은 대륙에서 약 35 km 깊이에 있는 지각과 맨틀의 경계입니다. 구텐베르크면(약 2,900 km)은 맨틀과 외핵, 레만면(약 5,100 km)은 외핵과 내핵의 경계입니다." },

      q: "PS시로 각 관측소에서 진앙까지의 거리를 구했습니다. 진앙의 위치를 한 점으로 정하려면 적어도 몇 곳의 관측소 기록이 필요할까요?",

      box: "ㄱ. 각거리 120°인 관측소에는 P파와 S파가 모두 도달하지 않는다.<br>ㄴ. 각거리 160°인 관측소에는 S파만 도달한다.<br>ㄷ. 각거리 103°보다 먼 곳에 S파가 오지 않는 것은 외핵이 액체이기 때문이다.",

      box: "〈자료〉 약 35 km에서 P파·S파가 갑자기 빨라진다. 약 2,900 km에서 P파가 갑자기 느려지고, 2,900~5,100 km에서는 S파 속도가 0이다. 약 5,100 km에서 P파가 다시 빨라지고 S파가 나타난다.<br>ㄱ. 약 2,900 km 깊이에 물질의 성질이 크게 달라지는 경계가 있다.<br>ㄴ. 2,900~5,100 km 구간은 액체 상태이다.<br>ㄷ. 맨틀에서 S파가 전파되지 않으므로 맨틀은 액체이다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "속도가 갑자기 바뀌는 깊이가 층의 경계입니다(ㄱ). S파 속도가 0인 외핵은 액체입니다(ㄴ). 맨틀(약 35~2,900 km)에서는 S파가 전파되므로 맨틀은 고체이고, ㄷ은 틀립니다." },
    { lv: "심화", type: "essay", ref: 11,
      q: "어떤 학생이 ‘지구 속은 중심까지 한결같은 단단한 고체 덩어리다’라고 주장했습니다. 지진파 관측에서 얻은 증거 두 가지를 들어 이 주장을 반박하세요.",
      model: "첫째, S파는 고체만 지나는데 진원에서 각거리 103°보다 먼 곳에는 S파가 전혀 오지 않는다. 그 길목에 S파가 지나지 못하는 액체(외핵)가 있다는 뜻이므로 지구 속이 모두 고체인 것은 아니다. 둘째, 깊이 약 35 km, 2,900 km, 5,100 km에서 지진파 속도가 갑자기 바뀌고 103°~142°에는 P파도 굴절 때문에 오지 않는다. 이는 성질이 다른 층들이 경계를 이루고 있다는 뜻이므로 지구 속은 한결같지 않다.",
