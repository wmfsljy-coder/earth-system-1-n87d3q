<script>
/* 형성평가 — 지구시스템과학1 Ⅰ-2 02 판의 경계와 이동의 원동력(판의 경계 · 해령 밀기와 판 끌기 · 열점 · 플룸 구조론). 값은 단원 화면과 칠판 강의 화면(board-02.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "지구시스템과학1", unit: "Ⅰ-2 판 구조 운동과 지구 내부 구조", part: "02 판의 경계와 이동의 원동력",
  std: ["12지시01-03"], board: "board-02.html", sheet: "sheet-02.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 5,
      q: "두 판이 서로 멀어지는 경계에서 주로 나타나는 지형은?",
      opts: ["해령", "해구", "습곡 산맥", "호상 열도"],
      a: 0, why: "판이 멀어지는 발산형 경계에서는 마그마가 올라와 새 해양 지각이 만들어지며 해령(대륙에서는 열곡)이 생깁니다. 해구·습곡 산맥·호상 열도는 수렴형 경계의 지형입니다." },
    { lv: "기본", type: "short", ref: 4,
      q: "판(암석권) 아래에 있으며, 녹은 층이 아니라 대부분 고체이지만 아주 오랜 시간에 걸쳐 천천히 흐를 수 있는 층을 무엇이라고 할까요?",
      a: ["연약권"], why: "연약권은 녹은 마그마 바다가 아니라 대부분 고체입니다. 무르기 때문에 그 위의 단단한 판이 움직일 수 있습니다." },
    { lv: "기본", type: "mc", ref: 5,
      q: "보존형 경계에 대한 설명으로 옳은 것은?",
      opts: ["새 해양 지각이 만들어진다",
             "한 판이 다른 판 아래로 가라앉아 지각이 사라진다",
             "두 판이 스쳐 지나가며 변환 단층이 생기고, 지각이 생기지도 사라지지도 않는다",
             "대륙끼리 부딪쳐 높은 산맥이 솟는다"],
      a: 2, why: "보존형 경계에서는 두 판이 서로 반대 방향으로 스쳐 지나갑니다. 지진은 자주 일어나지만 지각은 생기지도 사라지지도 않습니다. 산안드레아스 단층이 예입니다." },
    { lv: "발전", type: "mc", ref: 8,
      q: "표는 실제 판들의 이동 속도입니다. 이 자료에 대한 해석으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "태평양판 9.0 · 나스카판 7.4 · 인도-호주판 6.2 · 아프리카판 2.1 · 북아메리카판 1.9 · 유라시아판 0.9 (cm/년)<br>ㄱ. 태평양판은 유라시아판보다 10배 가까이 빠르다.<br>ㄴ. 가장자리에 섭입대가 많은 판일수록 빠른 경향이 있어, 판 끌기가 큰 힘임을 보여 준다.<br>ㄷ. 판의 속도 차이는 해령 밀기만으로 가장 잘 설명된다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "9.0 ÷ 0.9 = 10이므로 ㄱ은 옳습니다. 빠른 판은 가장자리 상당 부분이 해구로 가라앉는 판이고, 해령의 길이보다 섭입대의 길이가 속도를 더 잘 설명합니다. 그래서 ㄷ은 틀립니다." },
    { lv: "발전", type: "short", ref: 10, unit: "cm/년",
      q: "어느 열점 화산 열에서 열점으로부터 1,800 km 떨어진 해산의 나이가 2,000만 년이었습니다. 이 판의 평균 이동 속도는 몇 cm/년일까요? (1 cm/년 = 10 km/100만 년)",
      a: ["9", "9.0", "약9"], why: "1,800 km ÷ 2,000만 년 = 100만 년에 90 km이고, 이는 9 cm/년입니다. 열점은 거의 제자리에 있으므로 화산이 열점에서 멀어진 거리가 곧 판이 움직인 거리입니다." },
    { lv: "발전", type: "mc", ref: 10,
      q: "하와이–엠퍼러 해산열은 열점에서 약 3,500 km, 약 4,700만 년 된 지점에서 북쪽으로 꺾입니다. 거리와 나이의 관계가 꺾인 지점 앞뒤로 거의 한 직선을 이룬다면, 이 꺾임이 뜻하는 것은?",
      opts: ["그 무렵 태평양판의 이동 방향이 바뀌었다",
             "그 무렵 태평양판이 멈췄다",
             "그 무렵 태평양판의 속도가 크게 빨라졌다",
             "꺾인 지점 아래에 판 경계가 있다"],
      a: 0, why: "거리와 나이가 한 직선 위에 있으면 속도는 거의 그대로입니다. 화산 열의 방향은 판이 움직인 방향을 따라가므로, 꺾임은 약 4,700만 년 전 판의 이동 방향이 북북서에서 서북서로 바뀐 기록입니다." },
    { lv: "심화", type: "mc", ref: 11,
      q: "다음 사례 가운데 판구조 운동(맨틀 상부의 운동)이 아니라 플룸에 의한 구조 운동으로 설명하는 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 일본 해구에서 태평양판이 섭입한다.<br>ㄴ. 대륙 한가운데인 옐로스톤에서 화산 활동이 이어진다.<br>ㄷ. 대서양 중앙 해령에서 새 해양 지각이 만들어진다.<br>ㄹ. 맨틀과 핵의 경계 부근에서 거대한 뜨거운 기둥이 솟아오른다.",
      opts: ["ㄱ, ㄴ", "ㄴ, ㄷ", "ㄴ, ㄹ", "ㄱ, ㄷ", "ㄷ, ㄹ"],
      a: 2, why: "섭입(ㄱ)과 해령(ㄷ)은 판 경계에서 일어나는 판구조 운동입니다. 판 경계와 무관한 열점 화산(ㄴ)과 맨틀 바닥에서 솟는 핫 플룸(ㄹ)은 플룸 구조론으로 설명합니다." },
    { lv: "심화", type: "essay", ref: 11,
      q: "하와이의 화산과 일본의 화산은 서로 다른 원인으로 생깁니다. ‘맨틀 상부 운동’과 ‘플룸’이라는 말을 넣어 두 화산의 원인을 구분하고, 하와이 화산 열의 나이 분포가 판에 대해 무엇을 알려 주는지 쓰세요.",
      model: "일본의 화산은 태평양판이 일본 해구에서 섭입하는 수렴형 경계, 곧 맨틀 상부 운동으로 생긴다. 하와이의 화산은 판 경계와 무관하게 맨틀 깊은 곳에서 솟는 플룸 위의 열점에서 생긴다. 열점은 거의 제자리에 있고 판이 그 위를 지나가므로, 열점에서 멀수록 화산의 나이가 많다. 거리와 나이로 판의 이동 속도를, 화산 열의 방향으로 판의 이동 방향을 알 수 있다.",
      rubric: ["일본 화산을 판 경계(섭입, 맨틀 상부 운동)로 설명했다", "하와이 화산을 플룸·열점으로 설명했다", "나이 분포로 판의 이동 속도나 방향을 알 수 있다고 썼다"] }
  ]
};
