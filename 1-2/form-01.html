<title>형성평가 · 판구조론 정립의 증거 (지구시스템과학1 Ⅰ-2 01)</title>

<script>
/* 형성평가 — 지구시스템과학1 Ⅰ-2 01 판구조론 정립의 증거(대륙 이동설 · 복각 · 겉보기 극이동 곡선 · 해양저 확장설 · 판구조론). 값은 단원 화면과 칠판 강의 화면(board-01.html)에 맞춘다. ref = 칠판 장면 번호 */
window.FORMATIVE = {
  subject: "지구시스템과학1", unit: "Ⅰ-2 판 구조 운동과 지구 내부 구조", part: "01 판구조론 정립의 증거",
  std: ["12지시01-03"], board: "board-01.html", sheet: "sheet-01.html", time: "10분",
  items: [
    { lv: "기본", type: "mc", ref: 4,
      q: "민물에 살던 파충류 메소사우루스의 화석이 남아메리카와 아프리카 두 대륙에서만 발견됩니다. 이 사실은 처음에 어떤 주장의 증거로 쓰였을까요?",
      opts: ["대륙 이동설", "플룸 구조론", "지진파 그림자대", "마그마의 점성"],
      a: 0, why: "민물 파충류가 넓은 바다를 건넜다고 보기 어려우므로, 두 대륙이 붙어 있었다는 대륙 이동설의 증거로 쓰였습니다. 해안선, 빙하 자국, 이어지는 산맥도 같은 증거입니다." },
    { lv: "기본", type: "short", ref: 6,
      q: "적도에서는 0°, 자극에서는 90°가 되며, 용암이 굳을 때 암석에 기록되어 그 암석이 만들어진 위도를 알려 주는 각을 무엇이라고 할까요?",
      a: ["복각"], why: "자침이 수평면과 이루는 각이 복각입니다. tan(복각) = 2 × tan(위도)이므로 복각을 재면 옛 위도를 거꾸로 구할 수 있습니다." },
    { lv: "기본", type: "mc", ref: 10,
      q: "배에 자력계를 달고 해령을 가로지르며 해저 암석의 자기 방향을 재었습니다. 그 결과로 옳은 것은?",
      opts: ["해령 양쪽 모두 정자극기의 암석만 나타난다",
             "정자극기와 역자극기의 줄무늬가 해령을 축으로 좌우 대칭이다",
             "해령에서 멀어질수록 해양 지각의 나이가 적어진다",
             "줄무늬는 해령의 한쪽에만 나타난다"],
      a: 1, why: "줄무늬가 해령을 사이에 두고 좌우 대칭이고, 해령에서 멀어질수록 해양 지각의 나이가 많아집니다. 해령에서 새 지각이 생겨 양옆으로 밀려 나간다는 해양저 확장설의 증거입니다." },
    { lv: "발전", type: "short", ref: 11, unit: "cm/년",
      q: "어느 해령에서 400 km 떨어진 곳의 해양 지각 나이가 1,000만 년이었습니다. 이 해령의 한쪽 방향 평균 확장 속도는 몇 cm/년일까요? (1 cm/년 = 10 km/100만 년)",
      a: ["4", "4.0", "약4"], why: "400 km ÷ 1,000만 년 = 100만 년에 40 km입니다. 1 cm/년이 100만 년에 10 km이므로 40 km는 4 cm/년입니다. 대서양 중앙 해령(약 2.5 cm/년)보다 빠르고 동태평양 해령(약 6 cm/년)보다 느립니다." },
    { lv: "발전", type: "mc", ref: 7,
      q: "어느 섬에서 오늘 잰 복각은 0°에 가깝고, 같은 섬의 오래된 용암에 기록된 복각은 60°보다 큽니다. 옳은 설명만을 〈보기〉에서 있는 대로 고른 것은? (tan(복각) = 2 × tan(위도))",
      box: "ㄱ. 이 섬은 지금 적도 부근에 있다.<br>ㄴ. 그 용암이 굳을 때 섬은 지금보다 고위도에 있었다.<br>ㄷ. 복각이 달라진 것으로 보아 섬은 처음부터 지금 자리에 있었다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "복각 0°는 적도이므로 ㄱ은 옳습니다. 복각이 60°보다 크면 위도가 약 41°보다 높으므로(tan 60° ÷ 2 ≈ 0.87), 그때 섬은 고위도에 있었습니다. 위도가 바뀌었으니 섬이 이동한 것이고 ㄷ은 틀립니다." },
    { lv: "발전", type: "mc", ref: 8,
      q: "북아메리카와 유럽의 암석으로 각각 구한 겉보기 극이동 곡선은 서로 어긋나지만, 대서양을 닫아 유럽을 되돌리면 하나로 겹칩니다. 이로부터 알 수 있는 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 각 시대의 자북극은 하나였다.<br>ㄴ. 두 대륙은 과거에 지금보다 가까이 붙어 있었다.<br>ㄷ. 곡선이 어긋난 것은 대륙마다 복각을 재는 방법이 달랐기 때문이다.",
      opts: ["ㄱ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "대륙을 되돌리기만 해도 두 곡선이 겹치므로 자북극은 하나였고(ㄱ), 움직인 것은 대륙입니다(ㄴ). 측정 방법은 같으므로 ㄷ은 틀립니다." },
    { lv: "심화", type: "mc", ref: 12,
      q: "1912년에 나온 대륙 이동설이 1960년대에 판구조론으로 받아들여진 과정에 대한 설명으로 옳은 것만을 〈보기〉에서 있는 대로 고른 것은?",
      box: "ㄱ. 해저 탐사로 얻은 고지자기 줄무늬와 해양 지각의 나이가 새 증거가 되었다.<br>ㄴ. 대륙이 단단한 해저를 헤치고 나아간다는 베게너의 생각이 그대로 증명되었다.<br>ㄷ. 대륙은 해양 지각과 함께 판에 실려 이동한다고 보게 되었다.",
      opts: ["ㄱ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"],
      a: 2, why: "대륙이 해저를 헤치고 간다는 그림은 틀렸습니다(ㄴ). 해령에서 새 바닥이 만들어져 바닥째 옮겨 가고, 그 위에 얹힌 대륙도 함께 실려 간다고 보게 되었습니다." },
    { lv: "심화", type: "essay", ref: 12,
      q: "베게너는 ‘무엇이 대륙을 움직였는가’에 답하지 못했습니다. 그 뒤 50년 동안 모인 해저의 증거 두 가지를 들어, 대륙이 실제로 어떻게 움직였는지 베게너에게 설명하는 글을 쓰세요.",
      model: "해령을 가로질러 재어 보니 정자극기와 역자극기의 고지자기 줄무늬가 해령을 축으로 좌우 대칭이었고, 해양 지각의 나이는 해령에서 멀어질수록 많아졌습니다. 이는 해령에서 새 해양 지각이 만들어져 양옆으로 밀려 나간다는 뜻입니다. 따라서 대륙이 해저를 헤치고 간 것이 아니라, 대륙이 해양 지각과 함께 판에 실려 옮겨 간 것입니다.",
      rubric: ["해저에서 얻은 증거 두 가지(대칭 줄무늬, 해양 지각의 나이 등)를 들었다", "해령에서 새 지각이 생겨 넓어진다는 해양저 확장을 설명했다", "대륙이 해저를 헤치는 것이 아니라 판에 실려 이동한다고 결론 내렸다"] }
  ]
};
</script>
